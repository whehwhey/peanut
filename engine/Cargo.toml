[package]
name = "peanut"
version = "0.1.0"
edition = "2024"

# The binary was called `automatheus` until 2026-08-17.  A symlink
# target/release/automatheus -> peanut is kept so older scripts still run.
[[bin]]
name = "peanut"
path = "src/main.rs"

[dependencies]
# Builder A: frontier-parallel subset construction (engine/src/det_par.rs).
# Only reachable with AM_PAR=<threads>; the default single-threaded path never
# enters a rayon pool.
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
